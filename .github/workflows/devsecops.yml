name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              # --exclude=".github" mencegah Semgrep memeriksa file workflow YAML
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    sca-scan:
        name: SCA Dependency Scan (pip-audit)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install pip-audit
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit

            - name: Audit Dependencies
              run: pip-audit -r requirements.txt

    secret-scan:
        name: Secret Scanning (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    build-images:
        name: Build images with docker
        runs-on: self-hosted
        steps:
        - name: Checkout Source Code
            uses: actions/checkout@v4
        
        - name: Build Docker Images
            run: |
            docker rmi secure-flask-app || true
            docker build -t secure-flask-app:latest .

    trivy:
      name: Scan Images with Trivy
      needs: ['secret-scan', 'sca-scan', 'pylint-check', sast-scan]
      runs-on: self-hosted
      steps:
        - name: Generate Timestamp
          run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

        - name: Ensure Trivy Cache Directory Exists
          run: mkdir -p $HOME/.cache/trivy

        - name: Scan Images with Trivy
          run: |
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $HOME/.cache/trivy:/root/.cache/ \
              aquasec/trivy:0.76.1 image \
              --severity MEDIUM,HIGH,CRITICAL \
              --format table \
              secure-flask-app:latest | tee trivy-scan-${{ env.TIMESTAMP }}.log

        - name: Upload Trivy Logs
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: trivy-log-${{ env.TIMESTAMP }}
            path: trivy-scan-${{ env.TIMESTAMP }}.log
        
        - name: Clean Up Local Trivy Log
          if: always()
          run: rm -f trivy-scan-${{ env.TIMESTAMP }}.log

    # ==========================================
    # CD STAGE: Deploy ke VM
    # ==========================================
    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check, trivy]
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
            - name: Build and Run Container
              run: |
                  docker build -t secure-flask-app:latest .
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
                  docker ps | grep web-flask

    notify-discord:
        name: Notify Discord
        needs: [sast-scan, pylint-check, sca-scan, secret-scan, trivy]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Kirim hasil ke Discord
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  SAST: ${{ needs.sast-scan.result }}
                  PYLINT: ${{ needs.pylint-check.result }}
                  SCA: ${{ needs.sca-scan.result }}
                  SECRET: ${{ needs.secret-scan.result }}
                  REPO: ${{ github.repository }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  SHA: ${{ github.sha }}
                  COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK_URL" ]; then
                      echo "Webhook Discord tidak tersedia, notifikasi dilewati."
                      exit 0
                  fi

                  icon() {
                      case "$1" in
                          success) echo "✅ lolos" ;;
                          failure) echo "❌ gagal" ;;
                          skipped) echo "⏭️ dilewati" ;;
                          cancelled) echo "⚪ dibatalkan" ;;
                          *) echo "❓ $1" ;;
                      esac
                  }

                  if [ "$SAST" = "success" ] && [ "$PYLINT" = "success" ] && [ "$SCA" = "success" ] && [ "$SECRET" = "success" ]; then
                      COLOR=3066993
                      TITLE="✅ Pipeline LOLOS"
                  else
                      COLOR=15158332
                      TITLE="❌ Pipeline GAGAL"
                  fi

                  MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-100)
                  AI=$(cat /tmp/ai.txt 2>/dev/null || true)

                  payload=$(jq -n \
                      --arg title "$TITLE" \
                      --arg url "$RUN_URL" \
                      --argjson color "$COLOR" \
                      --arg repo "$REPO" \
                      --arg branch "$BRANCH" \
                      --arg actor "$ACTOR" \
                      --arg sha "${SHA:0:7}" \
                      --arg msg "$MSG" \
                      --arg sast "$(icon "$SAST")" \
                      --arg pylint "$(icon "$PYLINT")" \
                      --arg sca "$(icon "$SCA")" \
                      --arg secret "$(icon "$SECRET")" \
                      --arg ai "$AI" \
                      '{embeds: [{
                          title: $title, url: $url, color: $color,
                          description: ("Repo: **" + $repo + "**\nBranch: `" + $branch + "`\nOleh: " + $actor + "\nCommit: `" + $sha + "` " + $msg),
                          fields: ([
                              {name: "Semgrep (SAST)", value: $sast, inline: true},
                              {name: "Pylint (kualitas)", value: $pylint, inline: true},
                              {name: "pip-audit (SCA)", value: $sca, inline: true},
                              {name: "Gitleaks (secret)", value: $secret, inline: true}
                          ] + (if $ai != "" then [{name: "Analisis AI (Gemini)", value: $ai}] else [] end))
                      }]}')

                  curl -sS -f -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
