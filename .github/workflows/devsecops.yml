name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              # --exclude=".github" mencegah Semgrep memeriksa file workflow YAML
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CI JOB 3: SCA (pip-audit)
    # ==========================================
    sca-scan:
        name: SCA Dependency Scan (pip-audit)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install pip-audit
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit

            - name: Audit Dependencies
              run: pip-audit -r requirements.txt

    # ==========================================
    # CI JOB 4: Secret Scanning (Gitleaks)
    # ==========================================
    secret-scan:
        name: Secret Scanning (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ==========================================
    # CI JOB 5: Environment Check (.env)
    # ==========================================
    env-check:
        name: Environment (.env) Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Pastikan file .env tidak ter-commit
              run: |
                  LEAKED=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)
                  if [ -n "$LEAKED" ]; then
                      echo "::error::File environment ikut ter-commit: $LEAKED"
                      echo "Hapus dari git: git rm --cached <file>, lalu ganti semua nilai rahasia di dalamnya."
                      exit 1
                  fi
                  echo "OK: tidak ada file .env yang ter-commit."

            - name: Pastikan .env.example sinkron dengan app.py
              run: |
                  test -f .env.example || { echo "::error::.env.example tidak ditemukan"; exit 1; }
                  KEYS=$(grep -oE '(require_env|os\.getenv)\("[A-Z0-9_]+"' app.py | sed -E 's/.*\("//; s/"$//' | sort -u)
                  FAILED=0
                  for key in $KEYS; do
                      if ! grep -qE "^${key}=" .env.example; then
                          echo "::error::Variabel $key dipakai di app.py tetapi belum ada di .env.example"
                          FAILED=1
                      fi
                  done
                  [ "$FAILED" -eq 0 ] && echo "OK: semua variabel app.py terdaftar di .env.example:" && echo "$KEYS"
                  exit $FAILED

            - name: Pastikan .env tidak masuk ke image Docker
              run: |
                  test -f .dockerignore || { echo "::error::.dockerignore tidak ditemukan"; exit 1; }
                  grep -qxE '\.env' .dockerignore || { echo "::error::.dockerignore harus memuat baris .env"; exit 1; }
                  grep -qxE '\.env' .gitignore || { echo "::error::.gitignore harus memuat baris .env"; exit 1; }
                  echo "OK: .env diabaikan oleh git dan docker."

    # ==========================================
    # CI JOB 6: Build Docker Image
    # ==========================================
    build-images:
        name: Build images with docker
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build Docker Images
              run: |
                  docker rmi secure-flask-app || true
                  docker build -t secure-flask-app:latest .

    # ==========================================
    # CI JOB 7: Container Scan (Trivy) - gerbang terakhir sebelum CD
    # ==========================================
    trivy:
        name: Scan Images with Trivy
        needs: [secret-scan, sca-scan, pylint-check, sast-scan, env-check, build-images]
        runs-on: self-hosted
        steps:
            - name: Generate Timestamp
              run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

            - name: Ensure Trivy Cache Directory Exists
              run: mkdir -p $HOME/.cache/trivy

            - name: Scan Images with Trivy
              shell: bash
              run: |
                  docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    -v $HOME/.cache/trivy:/root/.cache/ \
                    aquasec/trivy:0.76.1 image \
                    --severity HIGH,CRITICAL \
                    --format table \
                    secure-flask-app:latest | tee trivy-scan-${{ env.TIMESTAMP }}.log

            - name: Upload Trivy Logs
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: trivy-log-${{ env.TIMESTAMP }}
                  path: trivy-scan-${{ env.TIMESTAMP }}.log

            - name: Clean Up Local Trivy Log
              if: always()
              run: rm -f trivy-scan-${{ env.TIMESTAMP }}.log

    # ==========================================
    # NOTIFIKASI CI
    # ==========================================
    notify-discord:
        name: Notify Discord
        needs: [sast-scan, pylint-check, sca-scan, secret-scan, env-check]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Kirim hasil ke Discord
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  SAST: ${{ needs.sast-scan.result }}
                  PYLINT: ${{ needs.pylint-check.result }}
                  SCA: ${{ needs.sca-scan.result }}
                  SECRET: ${{ needs.secret-scan.result }}
                  ENVCHECK: ${{ needs.env-check.result }}
                  REPO: ${{ github.repository }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  SHA: ${{ github.sha }}
                  COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK_URL" ]; then
                      echo "Webhook Discord tidak tersedia, notifikasi dilewati."
                      exit 0
                  fi

                  icon() {
                      case "$1" in
                          success) echo "✅ lolos" ;;
                          failure) echo "❌ gagal" ;;
                          skipped) echo "⏭️ dilewati" ;;
                          cancelled) echo "⚪ dibatalkan" ;;
                          *) echo "❓ $1" ;;
                      esac
                  }

                  if [ "$SAST" = "success" ] && [ "$PYLINT" = "success" ] && [ "$SCA" = "success" ] && [ "$SECRET" = "success" ] && [ "$ENVCHECK" = "success" ]; then
                      COLOR=3066993
                      TITLE="✅ Pipeline CI LOLOS"
                  else
                      COLOR=15158332
                      TITLE="❌ Pipeline CI GAGAL"
                  fi

                  MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-100)
                  AI=$(cat /tmp/ai.txt 2>/dev/null || true)

                  payload=$(jq -n \
                      --arg title "$TITLE" \
                      --arg url "$RUN_URL" \
                      --argjson color "$COLOR" \
                      --arg repo "$REPO" \
                      --arg branch "$BRANCH" \
                      --arg actor "$ACTOR" \
                      --arg sha "${SHA:0:7}" \
                      --arg msg "$MSG" \
                      --arg sast "$(icon "$SAST")" \
                      --arg pylint "$(icon "$PYLINT")" \
                      --arg sca "$(icon "$SCA")" \
                      --arg secret "$(icon "$SECRET")" \
                      --arg envcheck "$(icon "$ENVCHECK")" \
                      --arg ai "$AI" \
                      '{embeds: [{
                          title: $title, url: $url, color: $color,
                          description: ("Repo: **" + $repo + "**\nBranch: `" + $branch + "`\nOleh: " + $actor + "\nCommit: `" + $sha + "` " + $msg),
                          fields: ([
                              {name: "Semgrep (SAST)", value: $sast, inline: true},
                              {name: "Pylint (kualitas)", value: $pylint, inline: true},
                              {name: "pip-audit (SCA)", value: $sca, inline: true},
                              {name: "Gitleaks (secret)", value: $secret, inline: true},
                              {name: "Cek .env", value: $envcheck, inline: true}
                          ] + (if $ai != "" then [{name: "Analisis AI (Gemini)", value: $ai}] else [] end))
                      }]}')

                  curl -sS -f -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

    # ==========================================
    # CD STAGE: Deploy ke VM (hanya setelah merge / push ke main)
    # ==========================================
    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [trivy]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build and Run Container
              # Nilai rahasia diambil dari GitHub Secrets dan diteruskan ke
              # container lewat "docker run -e NAMA" (tanpa nilai di command line),
              # sehingga tidak muncul di daftar proses maupun di dalam repo.
              shell: bash
              env:
                  SECRET_KEY: ${{ secrets.SECRET_KEY }}
                  DB_HOST: mysql-flask
                  DB_PORT: "3306"
                  DB_NAME: flaskapp
                  DB_USER: flaskuser
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  # Variabel khusus image mysql (dipakai hanya saat volume masih kosong)
                  MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
                  MYSQL_DATABASE: flaskapp
                  MYSQL_USER: flaskuser
                  MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: |
                  set -euo pipefail

                  # Gagal cepat bila secret belum dibuat di GitHub
                  : "${SECRET_KEY:?Secret SECRET_KEY belum diatur di GitHub}"
                  : "${DB_PASSWORD:?Secret DB_PASSWORD belum diatur di GitHub}"
                  : "${MYSQL_ROOT_PASSWORD:?Secret DB_ROOT_PASSWORD belum diatur di GitHub}"

                  docker network inspect flask-net >/dev/null 2>&1 || docker network create flask-net

                  # MySQL dibuat sekali; data disimpan di volume agar aman saat redeploy
                  if ! docker ps -a --format '{{.Names}}' | grep -qx mysql-flask; then
                      docker run -d --name mysql-flask --network flask-net \
                        --restart unless-stopped \
                        -e MYSQL_ROOT_PASSWORD -e MYSQL_DATABASE -e MYSQL_USER -e MYSQL_PASSWORD \
                        -v mysql-flask-data:/var/lib/mysql \
                        --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" \
                        --health-interval 5s --health-retries 30 \
                        mysql:8.0
                  else
                      docker start mysql-flask >/dev/null
                  fi

                  echo "Menunggu MySQL siap..."
                  for i in $(seq 1 60); do
                      STATUS=$(docker inspect -f '{{.State.Health.Status}}' mysql-flask)
                      [ "$STATUS" = "healthy" ] && break
                      sleep 2
                  done
                  if [ "$STATUS" != "healthy" ]; then
                      echo "::error::MySQL tidak siap (status: $STATUS)"
                      docker logs --tail 50 mysql-flask
                      exit 1
                  fi

                  docker build -t secure-flask-app:latest .
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --name web-flask \
                    --network flask-net --restart unless-stopped \
                    -e SECRET_KEY -e DB_HOST -e DB_PORT -e DB_NAME -e DB_USER -e DB_PASSWORD \
                    secure-flask-app:latest
                  sleep 5
                  docker ps | grep web-flask
                  docker logs --tail 20 web-flask

    # ==========================================
    # NOTIFIKASI CD (hanya setelah merge / push ke main)
    # ==========================================
    notify-discord-cd:
        name: Notify Discord CD
        needs: [trivy, deploy-to-vm]
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Download Trivy Logs Artifact
              uses: actions/download-artifact@v4
              with:
                  pattern: trivy-log-*
                  path: ./trivy-logs
              continue-on-error: true

            - name: Kirim hasil ke Discord
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  TRIVY: ${{ needs.trivy.result }}
                  DEPLOY: ${{ needs.deploy-to-vm.result }}
                  REPO: ${{ github.repository }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  SHA: ${{ github.sha }}
                  COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK_URL" ]; then
                      echo "Webhook Discord tidak tersedia, notifikasi dilewati."
                      exit 0
                  fi

                  icon() {
                      case "$1" in
                          success) echo "✅ lolos" ;;
                          failure) echo "❌ gagal" ;;
                          skipped) echo "⏭️ dilewati" ;;
                          cancelled) echo "⚪ dibatalkan" ;;
                          *) echo "❓ $1" ;;
                      esac
                  }

                  if [ "$TRIVY" = "success" ] && [ "$DEPLOY" = "success" ]; then
                      COLOR=3066993
                      TITLE="✅ Pipeline CD LOLOS"
                  else
                      COLOR=15158332
                      TITLE="❌ Pipeline CD GAGAL"
                  fi

                  MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-100)
                  AI=$(cat /tmp/ai.txt 2>/dev/null || true)

                  # Ringkasan log Trivy (dipotong agar muat di batas 1024 karakter field Discord)
                  TRIVY_SUMMARY="Tidak ada log"
                  LOG_FILE=$(find ./trivy-logs -name "*.log" 2>/dev/null | head -n 1)
                  if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
                      TRIVY_SUMMARY=$(head -c 900 "$LOG_FILE")
                      if [ -z "$TRIVY_SUMMARY" ]; then
                          TRIVY_SUMMARY="Log kosong atau scan berhasil tanpa temuan."
                      fi
                  fi

                  payload=$(jq -n \
                      --arg title "$TITLE" \
                      --arg url "$RUN_URL" \
                      --argjson color "$COLOR" \
                      --arg repo "$REPO" \
                      --arg branch "$BRANCH" \
                      --arg actor "$ACTOR" \
                      --arg sha "${SHA:0:7}" \
                      --arg msg "$MSG" \
                      --arg trivy_status "$(icon "$TRIVY")" \
                      --arg deploy_status "$(icon "$DEPLOY")" \
                      --arg trivy_log "$TRIVY_SUMMARY" \
                      --arg ai "$AI" \
                      '{embeds: [{
                          title: $title, url: $url, color: $color,
                          description: ("Repo: **" + $repo + "**\nBranch: `" + $branch + "`\nOleh: " + $actor + "\nCommit: `" + $sha + "` " + $msg),
                          fields: ([
                              {name: "Trivy (Container)", value: $trivy_status, inline: true},
                              {name: "Deploy ke VM", value: $deploy_status, inline: true},
                              {name: "Ringkasan Log Trivy", value: ("```\n" + $trivy_log + "\n```"), inline: false}
                          ] + (if $ai != "" then [{name: "Analisis AI (Gemini)", value: $ai}] else [] end))
                      }]}')

                  curl -sS -f -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
